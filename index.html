<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#dfe6ec;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--tx);overflow:hidden}

.lbl.g:before{background:var(--ac)}.nol .lbl{opacity:0}

<script>
(function(){'use strict';
const W=8,D=6,WH=2.8,el=document.getElementById('view');
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(32,1,.1,100);
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
el.appendChild(R.domElement);
const ctl=new THREE.OrbitControls(cam,R.domElement);
ctl.enableDamping=true;ctl.dampingFactor=.07;ctl.maxPolarAngle=1.5;ctl.minDistance=2;ctl.maxDistance=32;ctl.autoRotateSpeed=1.2;
const hemi=new THREE.HemisphereLight(0xffffff,0xaab4bd,.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e0,.6);sun.position.set(-5,11,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0005;
Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7});scene.add(sun);
const lamps=[-2.4,0,2.4].map(x=>{const l=new THREE.PointLight(0xffe6bf,0,9,1.6);l.position.set(x,2.5,0);scene.add(l);return l});

const WOOD=0xd9bf99,WHITE=0xf4f3ef,STEEL=0xc5ccd1,DARK=0x4b5258,GLC=0xcfe6ee,GL={transparent:true,opacity:.35,roughness:.1};

const B=(p,w,h,d,c,x,y,z,o)=>add(p,new THREE.BoxGeometry(w,h,d),c,x,y,z,o);
const C=(p,a,b,h,c,x,y,z,o)=>add(p,new THREE.CylinderGeometry(a,b,h,22),c,x,y,z,o);
const pick=[];
function G(name,info,x,z,ry){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry||0;g.userData={name,info};scene.add(g);pick.push(g);return g}
function tex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;return t}

function poster(title,lines,col){return tex(300,400,(x,w,h)=>{x.fillStyle='#fff';x.fillRect(0,0,w,h);x.fillStyle=col;x.fillRect(0,0,w,70);x.fillStyle='#fff';x.font='bold 26px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(title,w/2,36);x.fillStyle='#333';x.font='20px Arial';x.textAlign='left';lines.forEach((s,i)=>x.fillText('• '+s,20,112+i*52))})}

const L=[];
function lab(t,x,y,z,c,g){const e=document.createElement('div');e.className='lbl'+(c?' '+c:'');e.textContent=t;el.appendChild(e);L.push({e,x,y,z,g,r0:g?g.rotation.y:0,ox:g?x-g.position.x:0,oz:g?z-g.position.z:0});return L[L.length-1]}
const v3=new THREE.Vector3();
function updL(){const w=el.clientWidth,h=el.clientHeight;L.forEach(l=>{let lx=l.x,lz=l.z;if(l.g){const d=l.g.rotation.y-l.r0,c=Math.cos(d),n=Math.sin(d);lx=l.g.position.x+l.ox*c+l.oz*n;lz=l.g.position.z-l.ox*n+l.oz*c}v3.set(lx,l.y,lz).project(cam);const ok=v3.z<1&&Math.abs(v3.x)<1.05&&Math.abs(v3.y)<1.05;l.e.style.display=ok?'':'none';l.e.style.left=(v3.x*.5+.5)*w+'px';l.e.style.top=(-v3.y*.5+.5)*h+'px'})}

B(scene,5.6,.012,3.6,0xcfe0ea,.1,.006,.25,{roughness:.9});lab('ZONA PRAKTIKUM',.1,.3,-1.55);
// jalur evakuasi menyala
B(scene,.28,.012,4.2,0x2ecc8a,-2.8,.008,.9,{emissive:0x1f9d63,emissiveIntensity:.5});
const WALL=0xf6f4f0;
const walls=[B(scene,W+.3,WH,.12,WALL,0,WH/2,-3.06),B(scene,.12,WH,D,WALL,-4.06,WH/2,0),B(scene,.12,.9,D,WALL,4.06,.45,0)];
B(scene,W+.3,WH,.12,WALL,0,WH/2,3.06,{transparent:true,opacity:.1,depthWrite:false});
B(scene,W+.3,.06,.14,0x9aa5ad,0,.03,-3.06);B(scene,.14,.06,D,0x9aa5ad,-4.06,.03,0);

const wm=[],jg=G('Jendela','Pencahayaan dan sirkulasi udara alami ruang praktikum.',0,0);
[-1.7,0,1.7].forEach(x=>{B(jg,1.5,1.1,.03,WHITE,x,1.75,-2.955);wm.push(B(jg,1.4,1,.02,0xbcd6e4,x,1.75,-2.93,{roughness:.15,metalness:.2}).material);B(jg,.03,1,.03,WHITE,x,1.75,-2.91);B(jg,1.6,.04,.12,WHITE,x,1.2,-2.9)});
lab('JENDELA',0,2.5,-2.94,'',jg);

function shelf(g,len,h,dep,n,door){const t=.03,ys=[];
B(g,len,h,.02,WOOD,0,h/2,-dep/2+.01);B(g,t,h,dep,WOOD,-len/2+t/2,h/2,0);B(g,t,h,dep,WOOD,len/2-t/2,h/2,0);B(g,len-.06,.08,.02,0x6b7378,0,.04,dep/2-.01);
for(let i=0;i<n;i++){const y=.08+i*(h-.08)/n;B(g,len-.06,t,dep-.02,WOOD,0,y+t/2,0);ys.push(y+t)}
B(g,len-.06,t,.03,WOOD,0,h-t/2,dep/2-.015);
if(door){B(g,len-.06,h-.14,.012,0xdfeaf0,0,h/2+.04,dep/2,GL);[-.05,.05].forEach(s=>B(g,.012,.15,.02,0x444444,s,h/2,dep/2+.01))}
return ys}
function fill(g,ys,len,per,fn){ys.forEach((y,j)=>{for(let i=0;i<per;i++)fn(g,(i-(per-1)/2)*(len-.2)/per,y,0,i,j)})}

const flask=(p,x,y,z)=>{C(p,.012,.045,.1,GLC,x,y+.05,z,GL);C(p,.014,.014,.05,GLC,x,y+.125,z,GL)};
const tubes=(p,x,y,z)=>{B(p,.2,.05,.07,WOOD,x,y+.025,z);for(let i=0;i<4;i++)C(p,.008,.008,.1,GLC,x-.075+i*.05,y+.1,z,GL)};
const bottle=(p,x,y,z,s,c)=>{C(p,.03*s,.03*s,.1*s,c,x,y+.05*s,z);C(p,.012*s,.016*s,.03*s,c,x,y+.115*s,z);C(p,.014*s,.014*s,.02*s,0xeeeeee,x,y+.14*s,z)};
function micro(p,x,y,z){const g=new THREE.Group();g.position.set(x,y,z);p.add(g);const K=0x2f353a;
B(g,.11,.016,.15,K,0,.008,0);B(g,.03,.2,.034,0xdfe3e6,0,.12,-.05);B(g,.07,.01,.07,0x777777,0,.1,0);B(g,.05,.03,.03,K,0,.11,-.03);
const t=C(g,.017,.017,.15,0xdfe3e6,0,.2,-.02,{metalness:.3});t.rotation.x=-.5;C(g,.01,.01,.04,K,0,.27,-.06);C(g,.012,.012,.03,0x888888,0,.075,0);
[-1,1].forEach(q=>{const k=C(g,.016,.016,.02,K,q*.026,.07,-.05);k.rotation.z=Math.PI/2})}
const coil=(p,x,y,z)=>{const m=add(p,new THREE.TorusGeometry(.05,.018,8,18),0xb87333,x,y+.018,z);m.rotation.x=Math.PI/2};
const ruler=(p,x,y,z)=>{B(p,.14,.006,.03,0xe6d28a,x,y+.003,z)};
const meter=(p,x,y,z)=>{B(p,.11,.08,.07,0x4a5a66,x,y+.04,z);B(p,.07,.04,.003,0xf2f2f2,x,y+.05,z+.036)};
const balance=(p,x,y,z)=>{B(p,.14,.02,.1,0x555555,x,y+.01,z);C(p,.045,.045,.008,STEEL,x,y+.03,z)};
const SP=(p,r,c,x,y,z,o)=>add(p,new THREE.SphereGeometry(r,16,12),c,x,y,z,o);
const BS=(p,x,y,z)=>C(p,.04,.045,.01,0x3a3f44,x,y+.005,z);
const microbox=(p,x,y,z)=>{B(p,.17,.1,.15,0x8a6a45,x,y+.05,z);B(p,.175,.025,.155,0x70543a,x,y+.1,z);B(p,.06,.012,.012,STEEL,x,y+.125,z);B(p,.03,.03,.006,STEEL,x,y+.09,z+.078,{metalness:.7});B(p,.07,.035,.003,0xf5f5f0,x,y+.05,z+.077)};
const torsoB=(p,x,y,z)=>{const F=0xe8c3a5;C(p,.1,.11,.02,0x3a3f44,x,y+.01,z);C(p,.015,.015,.06,0x3a3f44,x,y+.05,z);C(p,.09,.07,.27,F,x,y+.2,z);SP(p,.045,F,x-.1,y+.32,z);SP(p,.045,F,x+.1,y+.32,z);C(p,.025,.03,.05,F,x,y+.37,z);SP(p,.055,F,x,y+.43,z);
B(p,.06,.11,.012,0xe6a0a0,x-.04,y+.27,z+.088);B(p,.06,.11,.012,0xe6a0a0,x+.04,y+.27,z+.088);SP(p,.022,0xb83a3a,x-.01,y+.24,z+.1);B(p,.05,.04,.012,0x8a4b2d,x+.03,y+.16,z+.088);B(p,.11,.06,.012,0xf0b08a,x,y+.1,z+.08)};
const heart=(p,x,y,z)=>{BS(p,x,y,z);const h=SP(p,.045,0xb83a3a,x,y+.06,z);h.scale.set(1,1.15,.9);C(p,.012,.012,.05,0xd9534f,x-.01,y+.12,z);C(p,.01,.01,.045,0x3b6fb6,x+.03,y+.11,z)};
const brain=(p,x,y,z)=>{BS(p,x,y,z);const b=SP(p,.05,0xe8a7b5,x,y+.065,z);b.scale.set(1.2,.85,1.35);C(p,.01,.008,.04,0xf0c8a0,x,y+.03,z+.01)};

const flower=(p,x,y,z)=>{C(p,.04,.03,.04,0xc77b4a,x,y+.02,z);C(p,.004,.004,.15,0x3f8f4a,x,y+.115,z);for(let i=0;i<6;i++){const a=i*Math.PI/3;SP(p,.02,0xe85a8c,x+Math.cos(a)*.033,y+.2+Math.sin(a)*.033,z)}SP(p,.017,0xf5c542,x,y+.2,z+.005)};

const torso=(p,x,y,z)=>{B(p,.1,.012,.1,0x3a3f44,x,y+.006,z);C(p,.04,.05,.12,0xe7c1a4,x,y+.07,z);SP(p,.03,0xe7c1a4,x,y+.155,z);B(p,.03,.04,.005,0xc9453a,x,y+.09,z+.045)};

[['Rak Mikroskop','Mikroskop di rak atas, box penyimpanannya tepat di bawah. Terlindungi, tertata, mudah diinventarisasi.',-1.9,.95,1],

pj.userData.act=()=>{bm.visible=!bm.visible};pj.userData.tip='Klik untuk menyalakan/mematikan proyektor.';
const nv=document.getElementById('nav');[...new Set(pick.map(g=>g.userData.name))].sort().forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;nv.appendChild(o)});
nv.onchange=()=>{const o=pick.find(g=>g.userData.name===nv.value);nv.value='';if(!o)return;panel.querySelector('h3').textContent=o.userData.name.toUpperCase();panel.querySelector('p').textContent=txt(o);panel.hidden=false;const t=o.getWorldPosition(new THREE.Vector3());t.y=.8;const d=cam.position.clone().sub(t).normalize().multiplyScalar(5.5).add(t);fly([d.x,Math.max(d.y,2.5),d.z],[t.x,t.y,t.z],1)};
// ---------- interaksi ----------
const panel=document.getElementById('panel');
document.getElementById('close').onclick=()=>{panel.hidden=true};
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let dn=null,hov=null,tw=null;
function fly(p,t,d){tw={p0:cam.position.clone(),t0:ctl.target.clone(),p1:new THREE.Vector3(p[0],p[1],p[2]),t1:new THREE.Vector3(t[0],t[1],t[2]),s:performance.now(),d:(d||1.2)*1000}}
function stepTw(){if(!tw)return;let k=Math.min(1,(performance.now()-tw.s)/tw.d);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;cam.position.lerpVectors(tw.p0,tw.p1,k);ctl.target.lerpVectors(tw.t0,tw.t1,k);if(k>=1)tw=null}
function hit(e){const r=R.domElement.getBoundingClientRect();mp.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mp,cam);const h=ray.intersectObjects(pick,true)[0];if(!h)return null;let o=h.object;while(o&&!pick.includes(o))o=o.parent;return o}
function glow(g,on){g&&g.traverse(m=>{if(m.material&&m.material.emissive&&!m.userData.keep){if(on&&m.userData.e===undefined)m.userData.e=m.material.emissive.getHex();m.material.emissive.setHex(on?0x2a6f9e:(m.userData.e||0));if(!on)delete m.userData.e}})}
R.domElement.addEventListener('pointermove',e=>{if(drag){drag2(e);return}if(floorPt(e))crd.textContent='X '+(pt.x+4).toFixed(2)+' m · Z '+(pt.z+3).toFixed(2)+' m';if(e.buttons)return;const o=hit(e);if(o!==hov){glow(hov,false);glow(o,true);hov=o;R.domElement.style.cursor=o?'pointer':'grab'}});
let edit=false,drag=null,sel=null,meas=false;const off=new THREE.Vector3(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),pt=new THREE.Vector3();
function moveTo(g,x,z){const dx=x-g.position.x,dz=z-g.position.z;g.position.x=x;g.position.z=z;(g.userData.kids||[]).forEach(k=>{k.position.x+=dx;k.position.z+=dz})}
function floorPt(e){const r=R.domElement.getBoundingClientRect();mp.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mp,cam);return ray.ray.intersectPlane(pl,pt)}
function drag2(e){if(!floorPt(e))return;const g=drag,u=g.userData,sn=v=>Math.round(v/.05)*.05;
if(u.k==='w')return wallSnap(g,pt.x,pt.z);
if(u.k==='s'){g.position.x=Math.max(u.lo,Math.min(u.hi,sn(pt.x-off.x)));return}
const t=u.kids?[3.3,2.2]:[3.7,2.8];moveTo(g,Math.max(-t[0],Math.min(t[0],sn(pt.x-off.x))),Math.max(-t[1],Math.min(t[1],sn(pt.z-off.z))))}
R.domElement.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY];tw=null;if(!edit||meas)return;const o=hit(e),g=o&&(o.userData.own||(o.userData.mv?o:null));if(g&&floorPt(e)){drag=sel=g;off.set(pt.x-g.position.x,0,pt.z-g.position.z);ctl.enabled=false;glow(g,true)}});
R.domElement.addEventListener('pointerup',e=>{if(drag){glow(drag,false);drag=null;ctl.enabled=true;dn=null;post();return}if(meas){if(dn&&Math.hypot(e.clientX-dn[0],e.clientY-dn[1])<6&&floorPt(e))mClick();return}if(edit||!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;const o=hit(e);if(!o)return;
panel.querySelector('h3').textContent=o.userData.name.toUpperCase();panel.querySelector('p').textContent=txt(o);panel.hidden=false;if(o.userData.act)o.userData.act();
const t=o.getWorldPosition(new THREE.Vector3());t.y=.8;const d=cam.position.clone().sub(t).normalize().multiplyScalar(5.5).add(t);fly([d.x,Math.max(d.y,2.5),d.z],[t.x,t.y,t.z],1)});

// ---------- tombol ----------
let isNight=false,doorOpen=false,doorT=0;
function setDoor(v){doorOpen=v;const b=document.querySelector('[data-a=door2]');b.textContent=v?'Tutup Pintu':'Buka Pintu';b.classList.toggle('on',v)}
function setNight(on){isNight=on;el.classList.toggle('night',on);hemi.intensity=on?.22:.8;sun.intensity=on?.12:.6;lamps.forEach(l=>l.intensity=on?1.1:0);gnd.material.color.setHex(on?0x1c252e:0xdde3e8);wm.forEach(m=>{m.color.setHex(on?0x1b2a3a:0xbcd6e4)});R.toneMappingExposure=on?1.3:1.05}
const bars=document.querySelectorAll('#bar button');
const home=()=>{const k=Math.max(1,1.7/cam.aspect);return[[.8*k,10.5*k,10.5*k],[0,.3,.2]]};
const views=['iso','top','door'];
function view(a){bars.forEach(b=>{if(views.includes(b.dataset.a))b.classList.toggle('on',b.dataset.a===a)});ctl.autoRotate=false;document.querySelector('[data-a=tour]').classList.remove('on');
if(a==='iso'){const h=home();fly(h[0],h[1])}
if(a==='top')fly([0,16,.5],[0,0,0],1.3);
if(a==='door')fly([-2.6,1.7,2.6],[1.2,.9,-1.2],1.5)}
bars.forEach(b=>b.onclick=()=>{const a=b.dataset.a;
if(views.includes(a))return view(a);
if(a==='tour'){ctl.autoRotate=!ctl.autoRotate;b.classList.toggle('on',ctl.autoRotate);if(ctl.autoRotate&&cam.position.y<4)view('iso')}
if(a==='door2')setDoor(!doorOpen);
if(a==='edit'){edit=!edit;b.classList.toggle('on',edit);b.textContent=edit?'Selesai Atur':'Atur Layout';if(edit){pick.forEach(g=>{if((g.userData.mv||g.userData.own)&&!g.userData.p0)g.userData.p0=g.position.clone()});view('top');panel.hidden=true}document.getElementById('hint').textContent=edit?'Mode atur: seret objek apa pun · objek dinding otomatis menempel ke dinding':'Seret: putar · Scroll/cubit: zoom'}
if(a==='reset'){pick.forEach(g=>{if(g.userData.p0){g.position.copy(g.userData.p0);g.rotation.y=g.userData.r0}});post()}
if(a==='night'){setNight(!isNight);b.textContent=isNight?'Siang':'Malam';b.classList.toggle('on',isNight)}
if(a==='lbl'){el.classList.toggle('nol');b.classList.toggle('on')}});

function rs(){const w=el.clientWidth,h=el.clientHeight;R.setSize(w,h);R.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=w/h;cam.updateProjectionMatrix()}
window.addEventListener('resize',rs);rs();
const h0=home();cam.position.set(h0[0][0]*.6,h0[0][1]*1.5,h0[0][2]*1.3);ctl.target.set(0,.3,.2);fly(h0[0],h0[1],2);
(function loop(){requestAnimationFrame(loop);cg.setAttribute('transform','rotate('+(ctl.getAzimuthalAngle()*57.3).toFixed(1)+')');water.forEach((w,i)=>{w.visible=waterOn;w.material.opacity=.4+Math.sin(performance.now()/60+i)*.15});doorT+=((doorOpen?1.15:0)-doorT)*.08;leaf.rotation.y=doorT;stepTw();ctl.update();R.render(scene,cam);updL()})();
})();
